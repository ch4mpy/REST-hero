cn: host.docker.internal
# the dev certificate (${cn}.crt and ${cn}.key) is read outside the jar: an absolute path,
# written in .env by build-0-env.sh (the IDE loads .env; build-openapi.sh sources it)
dev-certs-dir: ${REST_HERO_CERTS_DIR}
gateway-client-id: gateway
gateway-client-secret: ${GATEWAY_CLIENT_SECRET:secret}
reverse-proxy-uri: https://${cn}
issuer: ${reverse-proxy-uri}/auth/realms/labs
accounts-service: https://${cn}:8081
cards-service: https://${cn}:8082
customers-service: https://${cn}:8083
currencies-service: https://${cn}:8084

server:
  # dev: the loopback only; Keycloak and the reverse proxy, in their containers, reach it through host.docker.internal, which resolves to the
  # loopback; a management port follows it (ManagementAddressConfiguration); every interface with
  # demo, below
  address: 127.0.0.1
  port: 7080
  servlet:
    context-path: /gateway
  shutdown: immediate
  ssl:
    enabled: true
    bundle: self-signed

spring:
  application:
    name: gateway
  security:
    oauth2:
      client:
        provider:
          sso:
            issuer-uri: ${issuer}
        registration:
          gateway:
            client-name: ${gateway-client-id}
            provider: sso
            client-id: ${gateway-client-id}
            client-secret: ${gateway-client-secret}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
  ssl:
    bundle:
      pem:
        self-signed:
          keystore:
            certificate: file:${dev-certs-dir}/${cn}.crt
            private-key: file:${dev-certs-dir}/${cn}.key
          truststore:
            certificate: file:${dev-certs-dir}/${cn}.crt
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Applies the OAuth2 BFF pattern (oauth2Login SecurityFilterChain and TokenRelay= filter to replace the session cookie with the access token in session)
            - id: accounts-bff
              uri: ${accounts-service}
              predicates:
                - Path=/bff/accounts/**,/bff/transfers/**
              filters:
                # replace the session cookie with the access token in session
                - TokenRelay=
                # remove the /gateway/bff prefix
                - StripPrefix=2
            - id: cards-bff
              uri: ${cards-service}
              predicates:
                - Path=/bff/cards/**
              filters:
                - TokenRelay=
                - StripPrefix=2
            - id: customers-bff
              uri: ${customers-service}
              predicates:
                - Path=/bff/customers/**
              filters:
                - TokenRelay=
                - StripPrefix=2
            - id: currencies-bff
              uri: ${currencies-service}
              predicates:
                - Path=/bff/currencies/**
              filters:
                - TokenRelay=
                - StripPrefix=2
    refresh:
      enabled: false
  web:
    error:
      # Exceptions nothing handles reach /error: their message is for the logs (an unreachable
      # Keycloak names its internal URL, for instance). Handled problems carry their own detail.
      include-message: never
  rabbitmq:
    host: ${cn}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rest-api}
    password: ${RABBITMQ_PASSWORD:secret}

rest-hero:
  events:
    subscribed-exchanges:
      - rest-hero.account-service
      - rest-hero.card-service
      - rest-hero.customer-service

springdoc:
  # currently broken (boot 4.1.0, springdoc-openapi 3.0.3)
  # workaround: SpringDocAuthenticationConfiguration
  show-login-endpoint: true

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${issuer}
            authorities:
              - path: $.resource_access.account-service.roles
                prefix: account.
              - path: $.resource_access.card-service.roles
                prefix: card.
              - path: $.resource_access.currency-service.roles
                prefix: currency.
              - path: $.resource_access.customer-service.roles
                prefix: customer.
        client:
          client-uri: ${reverse-proxy-uri}
          pkce-forced: true
          # the SPA's paths of the reverse proxy's origin (quoted: a dot of the host matches a dot only)
          post-login-allowed-uri-patterns:
            - \Q${reverse-proxy-uri}/ui\E(/.*)?
          post-login-redirect-host: ${reverse-proxy-uri}
          post-login-redirect-path: /ui/
          post-logout-allowed-uri-patterns:
            - \Q${reverse-proxy-uri}/ui\E(/.*)?
          post-logout-redirect-host: ${reverse-proxy-uri}
          post-logout-redirect-path: /ui/
          security-matchers:
            - /login/**
            - /oauth2/**
            - /logout/**
            - /bff/**
            - /me/**
          # What anonymous requests may reach, listed explicitly; anything else needs a session
          # (the SSE stream, /bff/events, among them). With resourceserver.permit-all below, the
          # whole list.
          permit-all:
            # Routes relayed downstream (spring.cloud.gateway.server.webmvc.routes): their access
            # control belongs to the downstream service. Every route's Path= must be here
            # (AnonymousAccessConfigurationTest).
            - /bff/accounts/**
            - /bff/transfers/**
            - /bff/cards/**
            - /bff/customers/**
            - /bff/currencies/**
            # Gateway endpoints that work without a session
            - /me
            - /login/**
            - /oauth2/**
            # without a session, a logout has no effect, and the SPA ends up logged out anyway
            - /logout
            # the registration's id is gateway: the back-channel logout endpoint is named after it
            - /logout/connect/back-channel/gateway
          csrf: cookie-accessible-from-js
          # the CSRF cookie must be accessible to both the BFF and the SPA code
          # while not colliding with other apps CSRF cookies
          csrf-cookie-path: /
          # A session cookie the gateway no longer knows (browser reopened, session expired, gateway
          # restarted). On /me only, a new session is opened and the request proceeds as without a
          # cookie: the session probe answers anonymous. Every other route gets the 401
          # unauthenticated problem of the gateway's own invalid-session strategy, never a
          # redirection, and opens no session (com.c4soft.resthero.gateway.security.ProblemSecurityConfiguration).
          invalid-session:
            pass-through-patterns:
              - /me
          oauth2-redirections:
            # no authentication-entry-point: the gateway's own entry point replaces spring-addons'
            # (401 unauthenticated problem, com.c4soft.resthero.gateway.security.ProblemSecurityConfiguration)
            pre-authorization-code: OK
            rp-initiated-logout: ACCEPTED
          back-channel-logout:
            enabled: true
            internal-logout-uri: ${reverse-proxy-uri}${server.servlet.context-path}/logout/connect/back-channel/gateway
        # The rest of the anonymous list (see client.permit-all); everything else outside the
        # client's security-matchers needs a token, which only the actuator serves
        resourceserver:
          permit-all:
            - /actuator/health
            # error dispatches are authorized like any request (com.c4soft.resthero.problem.ApiErrorController)
            - /error
            # This endpoint is exposed only with the Maven "openapi" profile
            - /v3/api-docs

management:
  endpoint:
    health:
      probes:
        enabled: true
      # the status and the names of its groups, nothing more
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        # health only: its probes are what an orchestrator reads, metrics and traces are pushed by
        # OTLP (below); a token of the realm is no authorization: any other endpoint (loggers, env,
        # caches, threaddump...) would be open to whoever holds one
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://host.docker.internal:4318/v1/metrics

logging:
  level:
    "[org.springframework]": INFO
---
spring:
  config:
    activate:
      on-profile: no-observability
management:
  endpoint:
    health:
      probes:
        enabled: false
  health:
    livenessstate:
      enabled: false
    readinessstate:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      enabled: false
  opentelemetry:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false
---
# a container deployment: the reverse proxy and the other applications reach it on the container's
# network address
spring:
  config:
    activate:
      on-profile: demo
server:
  address: 0.0.0.0
