cn: host.docker.internal
gateway-client-id: gateway
gateway-client-secret: secret
reverse-proxy-uri: https://${cn}
issuer: ${reverse-proxy-uri}/auth/realms/labs
accounts-service: https://${cn}:8081
cards-service: https://${cn}:8082
customers-service: https://${cn}:8083
currencies-service: https://${cn}:8084

server:
  port: 7080
  servlet:
    context-path: /gateway
  shutdown: immediate
  ssl:
    enabled: true
    bundle: self-signed

spring:
  application:
    name: gateway
  security:
    oauth2:
      client:
        provider:
          sso:
            issuer-uri: ${issuer}
        registration:
          gateway:
            client-name: ${gateway-client-id}
            provider: sso
            client-id: ${gateway-client-id}
            client-secret: ${gateway-client-secret}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
  ssl:
    bundle:
      pem:
        self-signed:
          keystore:
            certificate: classpath:${cn}.crt
            private-key: classpath:${cn}.key
          truststore:
            certificate: classpath:${cn}.crt
          reload-on-update: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Applies the OAuth2 BFF pattern (oauth2Login SecurityFilterChain and TokenRelay= filter to replace the session cookie with the access token in session)
            - id: accounts-bff
              uri: ${accounts-service}
              predicates:
                - Path=/bff/accounts/**,/bff/transfers/**
              filters:
                # replace the session cookie with the access token in session
                - TokenRelay=
                # remove the /gateway/bff prefix
                - StripPrefix=2
            - id: cards-bff
              uri: ${cards-service}
              predicates:
                - Path=/bff/cards/**
              filters:
                - TokenRelay=
                - StripPrefix=2
            - id: customers-bff
              uri: ${customers-service}
              predicates:
                - Path=/bff/customers/**
              filters:
                - TokenRelay=
                - StripPrefix=2
            - id: currencies-bff
              uri: ${currencies-service}
              predicates:
                - Path=/bff/currencies/**
              filters:
                - TokenRelay=
                - StripPrefix=2
    refresh:
      enabled: false
  web:
    error:
      include-message: always
  rabbitmq:
    host: ${cn}
    port: 5672
    username: rest-api
    password: secret

rest-hero:
  events:
    subscribed-exchanges:
      - rest-hero.account-service
      - rest-hero.card-service
      - rest-hero.customer-service

springdoc:
  # currently broken (boot 4.1.0, springdoc-openapi 3.0.3)
  # workaround: SpringDocAuthenticationConfiguration
  show-login-endpoint: true

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${issuer}
            authorities:
              - path: $.resource_access.${bff-client-id}.roles
        client:
          client-uri: ${reverse-proxy-uri}
          pkce-forced: true
          post-login-allowed-uri-patterns:
            - ${reverse-proxy-uri}/ui(/.*)?
          post-login-redirect-host: ${reverse-proxy-uri}
          post-login-redirect-path: /ui/
          post-logout-allowed-uri-patterns:
            - ${reverse-proxy-uri}/ui(/.*)?
          post-logout-redirect-host: ${reverse-proxy-uri}
          post-logout-redirect-path: /ui/
          security-matchers:
            - /login/**
            - /oauth2/**
            - /logout/**
            - /bff/**
            - /me
          permit-all:
            - /login/**
            - /oauth2/**
            - /logout/connect/back-channel/bff
            - /bff/**
            - /me
          csrf: cookie-accessible-from-js
          # the CSRF cookie must be accessible to both the BFF and the SPA code
          # while not colliding with other apps CSRF cookies
          csrf-cookie-path: /
          oauth2-redirections:
            authentication-entry-point: UNAUTHORIZED
            pre-authorization-code: OK
            rp-initiated-logout: ACCEPTED
          back-channel-logout:
            enabled: true
            internal-logout-uri: ${reverse-proxy-uri}${server.servlet.context-path}/logout/connect/back-channel/gateway
        resourceserver:
          permit-all:
            - /actuator/health
            # This endpoint is exposed only with the Maven "openapi" profile
            - /v3/api-docs

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://host.docker.internal:4318/v1/metrics

logging:
  level:
    "[org.springframework]": INFO
---
spring:
  config:
    activate:
      on-profile: no-observability
management:
  endpoint:
    health:
      probes:
        enabled: false
  health:
    livenessstate:
      enabled: false
    readinessstate:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      enabled: false
  opentelemetry:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false
