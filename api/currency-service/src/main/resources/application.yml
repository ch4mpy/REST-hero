cn: host.docker.internal
# the dev certificate (${cn}.crt and ${cn}.key) is read outside the jar: an absolute path,
# written in .env by build-0-env.sh (the IDE loads .env; build-openapi.sh sources it)
dev-certs-dir: ${REST_HERO_CERTS_DIR}
reverse-proxy-uri: https://${cn}
issuer: ${reverse-proxy-uri}/auth/realms/labs

server:
  # dev: the loopback only; the gateway reaches it through host.docker.internal, which resolves to the
  # loopback; a management port follows it (ManagementAddressConfiguration); every interface with
  # demo, below
  address: 127.0.0.1
  port: 8084
  shutdown: immediate
  ssl:
    enabled: true
    bundle: self-signed

spring:
  application:
    name: currency-service
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60m
  ssl:
    bundle:
      pem:
        self-signed:
          keystore:
            certificate: file:${dev-certs-dir}/${cn}.crt
            private-key: file:${dev-certs-dir}/${cn}.key
          truststore:
            certificate: file:${dev-certs-dir}/${cn}.crt
  web:
    error:
      include-message: never

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${issuer}
            authorities:
              - path: $.resource_access.${spring.application.name}.roles
                prefix: currency.
        resourceserver:
          permit-all:
            - /error
            - /actuator/health/readiness
            - /actuator/health/liveness
            - /v3/api-docs/**
            - /swagger-ui/**
      rest:
        client:
          frankfurter-client:
            base-url: https://api.frankfurter.dev/v2
management:
  endpoint:
    health:
      probes:
        enabled: true
      # the status and the names of its groups, nothing more
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        # health only: its probes are what an orchestrator reads, metrics and traces are pushed by
        # OTLP (below); a token of the realm is no authorization: any other endpoint (loggers, env,
        # caches, threaddump...) would be open to whoever holds one
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://host.docker.internal:4318/v1/metrics

logging:
  level:
    "[org.springframework]": INFO

---
spring:
  config:
    activate:
      on-profile: no-observability
management:
  endpoint:
    health:
      probes:
        enabled: false
  health:
    livenessstate:
      enabled: false
    readinessstate:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      enabled: false
  opentelemetry:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false
---
# a container deployment: the reverse proxy and the other applications reach it on the container's
# network address
spring:
  config:
    activate:
      on-profile: demo
server:
  address: 0.0.0.0
