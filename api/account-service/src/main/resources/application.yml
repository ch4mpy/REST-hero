cn: host.docker.internal
# the dev certificate (${cn}.crt and ${cn}.key) is read outside the jar: an absolute path,
# written in .env by build-0-env.sh (the IDE loads .env; build-openapi.sh sources it)
dev-certs-dir: ${REST_HERO_CERTS_DIR}
reverse-proxy-uri: https://${cn}
issuer: ${reverse-proxy-uri}/auth/realms/labs
account-service-client-id: account-service
account-service-client-secret: ${ACCOUNT_SERVICE_CLIENT_SECRET:secret}

server:
  port: 8081
  shutdown: immediate
  ssl:
    enabled: true
    bundle: self-signed

spring:
  application:
    name: account-service
  cache:
    type: simple
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  profiles:
    active:
      - postgresql
  security:
    oauth2:
      client:
        provider:
          sso:
            issuer-uri: ${issuer}
        registration:
          account-service:
            provider: sso
            authorization-grant-type: client_credentials
            client-id: ${account-service-client-id}
            client-secret: ${account-service-client-secret}
  ssl:
    bundle:
      pem:
        self-signed:
          keystore:
            certificate: file:${dev-certs-dir}/${cn}.crt
            private-key: file:${dev-certs-dir}/${cn}.key
          truststore:
            certificate: file:${dev-certs-dir}/${cn}.crt
  web:
    error:
      include-message: always
  rabbitmq:
    host: ${cn}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rest-api}
    password: ${RABBITMQ_PASSWORD:secret}

rest-hero:
  events:
    exchange-name: rest-hero.${spring.application.name}

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${issuer}
            authorities:
              - path: $.resource_access.${spring.application.name}.roles
                prefix: account.
        resourceserver:
          permit-all:
            - /accounts/**
            - /actuator/health/readiness
            - /actuator/health/liveness
            - /actuator/prometheus
            - /v3/api-docs/**
            - /swagger-ui/**
      rest:
        client:
          customer-service-client:
            base-url: https://${cn}:8083
            ssl-bundle: self-signed
            headers:
              Accept:
                - application/json
                - application/problem+json
            authorization:
              oauth2:
                oauth2-registration-id: account-service
          currencies-service-client:
            base-url: https://${cn}:8084
            ssl-bundle: self-signed
            headers:
              Accept:
                - application/json
                - application/problem+json
            authorization:
              oauth2:
                oauth2-registration-id: account-service
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://host.docker.internal:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://host.docker.internal:4318/v1/metrics

logging:
  level:
    "[org.springframework]": INFO

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:accounts
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
---
spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: jdbc:postgresql://host.docker.internal:${ACCOUNTS_DB_PORT:2633}/accounts
    username: rest-api
    # LAB:2.3:TODO:START renseigner le mot de passe applicatif : un placeholder, pas une valeur
    password: ${SPRING_DATASOURCE_PASSWORD}
    # LAB:2.3:TODO:END
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
---
spring:
  config:
    activate:
      on-profile: no-observability
management:
  endpoint:
    health:
      probes:
        enabled: false
  health:
    livenessstate:
      enabled: false
    readinessstate:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      enabled: false
  opentelemetry:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false
