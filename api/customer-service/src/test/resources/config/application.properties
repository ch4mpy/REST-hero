# Tests have no dev certificates: the SSL bundle reads them from ${REST_HERO_CERTS_DIR}, which only .env
# gives. Two actuator components read every bundle's files even with TLS off: the SSL metrics, when
# the context starts, and the ssl health indicator, on each /actuator/health. Both are off for every
# test of this module. Spring Boot reads classpath:/config/application.properties on top of
# application.yml; this file is on the test classpath only, never in the jar.
# A test that sets its own spring.autoconfigure.exclude replaces this value: it must list
# SslMetricsAutoConfiguration again.
spring.autoconfigure.exclude=org.springframework.boot.micrometer.metrics.autoconfigure.ssl.SslMetricsAutoConfiguration
management.health.ssl.enabled=false
